name: "Notify Slack on Version Bump PR"

on:
  pull_request:
    types: [opened, synchronize]

env:
  SLACK_CHANNEL_ID: 'ricos-dev-releases'

jobs:
  notify_slack:
    if: startsWith(github.event.pull_request.title, 'release(*):')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            package.json
          sparse-checkout-cone-mode: false
          fetch-depth: 5

      - name: Retrieve Changelog
        run: |
         {
            echo 'CHANGELOG<<EOF'
            git diff "HEAD^" --word-diff=porcelain -- ./CHANGELOG.md | grep '^\+' | sed 's/^+//' | tail -n +2
            echo EOF
          } >> "$GITHUB_ENV"
        id: changelog

      - name: Setup dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Check whether version is published
        uses: actions/github-script@v7
        with:
          script: |
            # const packageJson = require('./package.json');
            # console.log('Target version', packageJson.version)
            const packageJson = {
              version: '10.30.7'
            }

            const startTime = Date.now();
            const timeLimit = 3 * 60 * 1000;  // 3 minutes
            const intervalTime = 60 * 1000;  // 1 minute

            const intervalId = setInterval(() => {
              const currentTime = Date.now();
              const elapsedTime = currentTime - startTime;

              if (elapsedTime > timeLimit) {
                clearInterval(intervalId);
                throw new Error('Package was not published within 20 minutes');
              }

              fetch('https://static.parastorage.com/unpkg/ricos-schema@' + packageJson.version)
                .then(response => {
                  if (response.ok) {
                    console.log('Package with the given version exists!');
                    clearInterval(intervalId);
                  }
                })
                .catch(error => console.error('Error:', error));
            }, intervalTime);


      # - name: Convert Changelog to Slack Markdown
      #   uses: actions/github-script@v7
      #   id: set-result
      #   with:
      #     result-encoding: string
      #     script: |
      #       const slackifyMarkdown = require('slackify-markdown');
      #       const packageJson = require('./package.json');
      #       console.log('DEBUG packageJson', packageJson.version)


      # - name: Send message to Slack
      #   uses: slackapi/slack-github-action@v1.26.0
      #   with:
      #       channel-id: ${env.SLACK_CHANNEL_ID}
      #       payload: |
      #         {
      #           "blocks": [
      #             {
      #               "type": "section",
      #               "fields": [
      #                 {
      #                   "type": "plain_text",
      #                   "text": "New version of Ricos has been released!"
      #                 }
      #               ]
      #             },
      #             {
      #               "type": "section",
      #               "text": {
      #                 "type": "mrkdwn",
      #                 "text": ${{steps.set-result.outputs.result}}
      #               }
      #             }
      #           ]
      #         }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

