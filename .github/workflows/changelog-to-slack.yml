name: "Notify Slack on Version Bump PR"

on:
  pull_request:
    types: [opened, synchronize]

env:
  SLACK_CHANNEL_ID: 'ricos-dev-releases'

jobs:
  verify-package-published:
    if: startsWith(github.event.pull_request.title, 'release(*):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false
          fetch-depth: 5

      - name: Setup dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Check whether version is published
        uses: actions/github-script@v7
        with:
          script: |
            const packageJson = require('./package.json');
            const PACKAGE_NAME = 'ricos-schema';
            // const TARGET_VERSION = packageJson.version;
            const TARGET_VERSION = '10.31.0';

            const TIMEOUT_MINUTES = 4;
            const CHECK_INTERVAL = 60 * 1000; // 60 seconds

            const checkPackage = () => {
              return fetch('https://static.parastorage.com/unpkg/'+ PACKAGE_NAME+ '@' + TARGET_VERSION)
                .then(response => {
                  if (response.ok) {
                    console.log('Package with the given version exists!');
                    return true;
                  }
                })
                .catch(() => {
                  console.log('Target version: '+TARGET_VERSION+' not found');
                  return false;
                });
            };

            const main = async () => {
              const endTime = Date.now() + TIMEOUT_MINUTES * 60 * 1000;
              let isPublished = false;
              while (Date.now() < endTime || !isPublished) {
                try {
                  isPublished = await checkPackage();
                  if (isPublished) {
                    console.log(`Package ${PACKAGE_NAME} is published.`);
                    break;
                  } else {
                    console.log(`Package ${PACKAGE_NAME} is not published yet.`);
                    await new Promise(resolve => setTimeout(resolve, CHECK_INTERVAL));
                  }
                } catch (error) {
                  console.error(error);
                  process.exit(1);
                }
              }

              if (isPublished) {
                console.log(`Package ${PACKAGE_NAME} is published.`);
                process.exit(0);
              }

              console.log(`Timeout reached. Package ${PACKAGE_NAME} is not published.`);
              process.exit(1);
            };

            await main();

  send-message-to-slack:
    needs: verify-package-published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
          sparse-checkout-cone-mode: false
          fetch-depth: 5

      - name: Retrieve Changelog
        run: |
         {
            echo 'CHANGELOG<<EOF'
            git diff "HEAD^" --word-diff=porcelain -- ./CHANGELOG.md | grep '^\+' | sed 's/^+//' | tail -n +2
            echo EOF
          } >> "$GITHUB_ENV"
        id: changelog

      - name: Setup dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - run: npm install slackify-markdown

      - name: Convert Changelog to Slack Markdown
        uses: actions/github-script@v7
        id: set-result
        with:
          result-encoding: string
          script: |
            const slackifyMarkdown = require('slackify-markdown');
            const { CHANGELOG } = process.env;
            const message = slackifyMarkdown(CHANGELOG);
            console.log(message);
            return JSON.stringify(message);

      - name: Send message to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
            channel-id: ${env.SLACK_CHANNEL_ID}
            payload: |
              {
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "plain_text",
                        "text": "New version of Ricos has been released!"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ${{steps.set-result.outputs.result}}
                    }
                  }
                ]
              }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

