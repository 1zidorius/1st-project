name: "Notify Slack on Version Bump PR"

on:
  pull_request:
    types: [opened, synchronize]

env:
  SLACK_CHANNEL_ID: 'ricos-dev-releases'

jobs:
  verify-package-published:
    if: startsWith(github.event.pull_request.title, 'release(*):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/nested-folder/package.json
            .github/scripts/check-package-published.js
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Check whether package is published
        uses: actions/github-script@v7
        with:
          script: |
            const { checkPackagePublished } = require('./.github/scripts/check-package-published.js');
            const packageJson = require('./src/nested-folder/package.json');
            const TIMEOUT_MINUTES = 30;
            const TARGET_PACKAGE = packageJson.name + '@' + packageJson.version;

            await checkPackagePublished(TARGET_PACKAGE, TIMEOUT_MINUTES);


  send-message-to-slack:
    needs: verify-package-published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
          sparse-checkout-cone-mode: false
          fetch-depth: 5

      - name: Retrieve Changelog
        run: |
         {
            echo 'CHANGELOG<<EOF'
            git diff "HEAD^" --word-diff=porcelain -- ./CHANGELOG.md | grep '^\+' | sed 's/^+//' | tail -n +2
            echo EOF
          } >> "$GITHUB_ENV"
        id: changelog

      - name: Setup dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - run: npm install slackify-markdown

      - name: Convert Changelog to Slack Markdown
        uses: actions/github-script@v7
        id: set-result
        with:
          result-encoding: string
          script: |
            const slackifyMarkdown = require('slackify-markdown');
            const { CHANGELOG } = process.env;
            const message = slackifyMarkdown(CHANGELOG);
            console.log(message);
            return JSON.stringify(message);

      - name: Send message to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
            channel-id: ${env.SLACK_CHANNEL_ID}
            payload: |
              {
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "plain_text",
                        "text": "New version of Ricos has been released!"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ${{steps.set-result.outputs.result}}
                    }
                  }
                ]
              }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

