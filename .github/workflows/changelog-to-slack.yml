name: "Notify Slack on Version Bump PR"

on:
  pull_request:
    types: [opened, synchronize]

env:
  SLACK_CHANNEL_ID: 'ricos-dev-releases'

jobs:
  notify_slack:
    if: startsWith(github.event.pull_request.title, 'release(*):')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            package.json
          sparse-checkout-cone-mode: false
          fetch-depth: 5

      - name: Retrieve Changelog
        run: |
         {
            echo 'CHANGELOG<<EOF'
            git diff "HEAD^" --word-diff=porcelain -- ./CHANGELOG.md | grep '^\+' | sed 's/^+//' | tail -n +2
            echo EOF
          } >> "$GITHUB_ENV"
        id: changelog

      - name: Setup dependencies
        uses: actions/setup-node@v3
        id: does-version-exist
        with:
          node-version: '20.x'
      - name: Check whether version is published
        uses: actions/github-script@v7
        with:
          script: |
            const packageJson = require('./package.json');
            const packageName = 'ricos-schema'; // Replace with your package name
            const targetVersion = packageJson.version;

            const maxAttempts = 5;
            let attempt = 0;
            let versionsExists = false;

            while (attempt < maxAttempts && !versionsExists) {

              fetch('https://static.parastorage.com/unpkg/'+ packageName+ '@' + targetVersion)
                .then(response => {
                  if (response.ok) {
                    versionsExists = true;
                    console.log('Package with the given version exists!');
                  }
                })
                .catch(() => {
                  attempt++;
                });
              await new Promise(resolve => setTimeout(resolve, 60000));
            }

            if (versionsExists) {
              return true;
            }

            return false;


      # - name: Convert Changelog to Slack Markdown
      #   uses: actions/github-script@v7
        # id: set-result
      #   with:
      #     result-encoding: string
      #     script: |
      #       const slackifyMarkdown = require('slackify-markdown');
      #       const packageJson = require('./package.json');
      #       console.log('DEBUG packageJson', packageJson.version)


      # - name: Send message to Slack
      #   uses: slackapi/slack-github-action@v1.26.0
      #   with:
      #       channel-id: ${env.SLACK_CHANNEL_ID}
      #       payload: |
      #         {
      #           "blocks": [
      #             {
      #               "type": "section",
      #               "fields": [
      #                 {
      #                   "type": "plain_text",
      #                   "text": "New version of Ricos has been released!"
      #                 }
      #               ]
      #             },
      #             {
      #               "type": "section",
      #               "text": {
      #                 "type": "mrkdwn",
      #                 "text": ${{steps.set-result.outputs.result}}
      #               }
      #             }
      #           ]
      #         }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

