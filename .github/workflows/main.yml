name: Lock Branch

on:
  push:
    branches:
      - master

jobs:
  lock-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Lock Branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MERGE_FREEZE_ALL_PERM }}
          script: |
            const branch = 'master';  // Specify the branch you want to lock here
             const response = await github.rest.repos.getBranchProtection({
               owner: context.repo.owner,
               repo: context.repo.repo,
               branch: branch
             });
              console.log('GET_BRANCH_PROTECTION',JSON.stringify(response, null, 2));

              /*
              const response2 = await github.rest.repos.getAccessRestrictions({
               owner: context.repo.owner,
               repo: context.repo.repo,
               branch: 'readme-edit',
             });
             console.log('GET_BRANCH_PROTECTION',JSON.stringify(response2, null, 2));
             */
             
             const {data} = response;           
             const {required_status_checks, enforce_admins} = data;
             
            await github.rest.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              required_status_checks,
              enforce_admins,
              lock_branch: true,
            });
            console.log(`Branch ${branch} has been locked.`);
