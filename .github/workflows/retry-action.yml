name: Retry GitHub Action

on:
  pull_request:
    types: [ opened ]

jobs:
  retry-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - run: yarn
      - uses: actions/checkout@v3
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MERGE_FREEZE_ALL_PERM }}
          script: |
            const { default: retryActions } = await import('${{ github.workspace }}/src/retry-actions.js')

            await retryActions()
